services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:2.9.3
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./:/opt/airflow/hermes-orbital-data-pipeline
      - ./dags:/opt/airflow/dags
    command: bash -c "pip install -r /opt/airflow/hermes-orbital-data-pipeline/requirements.txt && airflow db migrate && airflow users create --username admin --password admin --firstname Hermes --lastname FIAP --role Admin --email admin@example.com || true"

  airflow-webserver:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./:/opt/airflow/hermes-orbital-data-pipeline
      - ./dags:/opt/airflow/dags
    command: bash -c "pip install -r /opt/airflow/hermes-orbital-data-pipeline/requirements.txt && airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.3
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./:/opt/airflow/hermes-orbital-data-pipeline
      - ./dags:/opt/airflow/dags
    command: bash -c "pip install -r /opt/airflow/hermes-orbital-data-pipeline/requirements.txt && airflow scheduler"

volumes:
  postgres-db-volume:
